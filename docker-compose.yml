# WindScope local stack: `docker compose up --build`
#   Dashboard   http://localhost:3000
#   API health  http://localhost:8000/api/health
#   API docs    http://localhost:8000/api/docs
name: windscope

services:
  backend:
    build: ./backend
    image: windscope-backend:local
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ELEXON_BASE_URL: ${ELEXON_BASE_URL:-https://data.elexon.co.uk/bmrs/api/v1}
      DATABASE_PATH: /app/data/windscope.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DECISION_DATE_START: ${DECISION_DATE_START:-2026-01-01}
      DECISION_DATE_END: ${DECISION_DATE_END:-2026-01-31}
      DEFAULT_CUTOFF_TIME: ${DEFAULT_CUTOFF_TIME:-10:00}
      DEFAULT_CUTOFF_DAYS_BEFORE: ${DEFAULT_CUTOFF_DAYS_BEFORE:-1}
      AUTO_INGEST_ON_STARTUP: ${AUTO_INGEST_ON_STARTUP:-true}
      STALE_AFTER_HOURS: ${STALE_AFTER_HOURS:-24}
    ports:
      - "8000:8000"
    volumes:
      - windscope-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    image: windscope-frontend:local
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  windscope-data:

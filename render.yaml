# Render Blueprint for the WindScope API (Docker runtime).
# The free plan has an ephemeral filesystem: the SQLite store is rebuilt from
# Elexon automatically on each cold start (AUTO_INGEST_ON_STARTUP=true).
services:
  - type: web
    name: windscope-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://windscope.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: ^https://.*\.vercel\.app$
      - key: AUTO_INGEST_ON_STARTUP
        value: "true"
      - key: DATABASE_PATH
        value: /app/data/windscope.db
